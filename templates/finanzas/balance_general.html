<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Balance General | Stockify</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/balance_general.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">
        <img src="{{ url_for('static', filename='img/logo.png') }}">
        <h2>Stockify</h2>
    </div>

    <a href="{{ url_for('finanzas.finanzas') }}" class="back">
        <i class="fa-solid fa-arrow-left"></i>
        Volver
    </a>

</header>

<main>

    <section class="title">

        <h1>Balance General</h1>

        <p>Consulta el estado financiero general del negocio.</p>

    </section>

    <section class="summary">

        <div class="summary-card">

            <i class="fa-solid fa-arrow-trend-up"></i>

            <h3>Total Ingresos</h3>

            <span>$0</span>

        </div>

        <div class="summary-card">

            <i class="fa-solid fa-arrow-trend-down"></i>

            <h3>Total Gastos</h3>

            <span>$0</span>

        </div>

        <div class="summary-card">

            <i class="fa-solid fa-hand-holding-dollar"></i>

            <h3>Cuentas por Cobrar</h3>

            <span>$0</span>

        </div>

        <div class="summary-card">

            <i class="fa-solid fa-file-invoice-dollar"></i>

            <h3>Cuentas por Pagar</h3>

            <span>$0</span>

        </div>

    </section>

    <div class="table-card">

        <table>

            <thead>

                <tr>

                    <th>Concepto</th>
                    <th>Valor</th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <td>Total de Ingresos</td>

                    <td>$0</td>

                </tr>

                <tr>

                    <td>Total de Gastos</td>

                    <td>$0</td>

                </tr>

                <tr>

                    <td>Cuentas por Cobrar</td>

                    <td>$0</td>

                </tr>

                <tr>

                    <td>Cuentas por Pagar</td>

                    <td>$0</td>

                </tr>

                <tr>

                    <td><strong>Utilidad Neta</strong></td>

                    <td><strong>$0</strong></td>

                </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
