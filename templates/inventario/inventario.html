<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario | Stockify</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/inventario.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="shortcut icon" href="{{ url_for('static', filename='img/negocios-y-finanzas.png') }}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<header>
<div class="logo">
<img src="{{ url_for('static', filename='img/logo.png') }}">
<h2>Stockify</h2>
</div>

<a href="{{ url_for('dashboard.dashboard') }}" class="back">
<i class="fa-solid fa-arrow-left"></i>
Dashboard
</a>
</header>

<main>

<section class="title">
<h1>Inventario</h1>
<p>Gestiona todos los productos de tu negocio.</p>
</section>

<section class="search">
<input type="text" id="buscarModulo" placeholder="Buscar módulo...">
<i class="fa-solid fa-magnifying-glass"></i>
</section>

<section class="cards">

<a href="{{ url_for('inventario.registrar_producto') }}" class="card">
<i class="fa-solid fa-boxes-stacked"></i>
<h3>Gestionar Productos</h3>
<p>Registrar, editar, activar o desactivar productos y consultar existencias.</p>
</a>

<a href="{{ url_for('inventario.categorias') }}" class="card">
<i class="fa-solid fa-layer-group"></i>
<h3>Categorías</h3>
<p>Crear y administrar las categorías del inventario.</p>
</a>

<a href="{{ url_for('inventario.movimientos') }}" class="card">
<i class="fa-solid fa-arrow-right-arrow-left"></i>
<h3>Movimientos</h3>
<p>Consultar entradas y salidas de inventario.</p>
</a>

</section>

</main>

<script>
const buscador = document.getElementById("buscarModulo");
const tarjetas = document.querySelectorAll(".cards .card");

buscador.addEventListener("input", () => {
    const texto = buscador.value.toLowerCase();

    tarjetas.forEach(tarjeta => {
        const titulo = tarjeta.querySelector("h3").textContent.toLowerCase();
        const descripcion = tarjeta.querySelector("p").textContent.toLowerCase();
        const coincide = titulo.includes(texto) || descripcion.includes(texto);

        tarjeta.style.display = coincide ? "" : "none";
    });
});
</script>

</body>
</html>
