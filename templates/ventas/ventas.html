<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ventas | Stockify</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/ventas.css') }}">

    <link rel="shortcut icon" href="{{ url_for('static', filename='img/negocios-y-finanzas.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">

        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo">

        <h2>Stockify</h2>

    </div>

    <a href="{{ url_for('dashboard.dashboard') }}" class="back">

        <i class="fa-solid fa-arrow-left"></i>

        Dashboard

    </a>

</header>

<main>

    <section class="title">

        <h1>Registrar Venta</h1>

        <p>Registra una venta con uno o varios productos.</p>

    </section>

    <form id="formVenta">

        <!-- ========================= -->
        <!-- PARTE SUPERIOR -->
        <!-- ========================= -->

        <section class="top-content">

            <!-- PANEL IZQUIERDO -->

            <div class="left-panel">

                <div class="card">

                    <h2>

                        <i class="fa-solid fa-user"></i>

                        Información del Cliente

                    </h2>

                    <div class="grid2">

                        <div class="group">

                            <label>Nombre del Cliente</label>

                            <input
                                type="text"
                                id="cliente"
                                name="cliente"
                                placeholder="Nombre completo">

                        </div>

                        <div class="group">

                            <label>CC / NIT</label>

                            <input
                                type="text"
                                id="documento"
                                name="documento"
                                placeholder="Opcional">

                        </div>

                        <div class="group">

                            <label>Fecha</label>

                            <input
                                type="date"
                                id="fecha"
                                name="fecha">

                        </div>

                        <div class="group">

                            <label>Método de Pago</label>

                            <select
                                id="metodo_pago"
                                name="metodo_pago">

                                <option>Efectivo</option>
                                <option>Nequi</option>
                                <option>Daviplata</option>
                                <option>Transferencia</option>
                                <option>Tarjeta Débito</option>
                                <option>Tarjeta Crédito</option>

                            </select>

                        </div>

                    </div>

                    <hr>

                    <h2>

                        <i class="fa-solid fa-cart-plus"></i>

                        Agregar Producto

                    </h2>

                    <div class="grid4">

                        <div class="group product">

                            <label>Producto</label>

                            <div class="search-product">

                                <input
                                    type="text"
                                    id="buscar_producto"
                                    placeholder="Buscar por nombre o código..."
                                    autocomplete="off">

                                <i class="fa-solid fa-magnifying-glass"></i>

                                <div
                                    id="lista_productos"
                                    class="results">

                                </div>

                            </div>

                            <input
                                type="hidden"
                                id="id_producto">

                        </div>

                        <div class="group">

                            <label>Cantidad</label>

                            <input
                                type="number"
                                id="cantidad"
                                min="1"
                                value="1">

                        </div>

                        <div class="group">

                            <label>Precio</label>

                            <input
                                type="number"
                                id="precio"
                                readonly>

                        </div>

                        <div class="group button-group">

                            <button
                                type="button"
                                id="agregar_producto"
                                class="add">

                                <i class="fa-solid fa-plus"></i>

                                Agregar

                            </button>

                        </div>

                    </div>

                </div>

            </div>

            <!-- PANEL DERECHO -->

            <aside class="summary">

                <div class="card">

                    <h2>

                        <i class="fa-solid fa-receipt"></i>

                        Resumen

                    </h2>

                    <div class="summary-list">

                        <div class="item">

                            <span>Productos</span>

                            <strong id="total_productos">0</strong>

                        </div>

                        <div class="item">

                            <span>Subtotal</span>

                            <strong id="subtotal">$0</strong>

                        </div>

                        <div class="item">

                            <span>Descuento</span>

                            <strong id="descuento">$0</strong>

                        </div>

                        <div class="item">

                            <span>IVA</span>

                            <strong id="iva">$0</strong>

                        </div>

                        <div class="total">

                            <span>Total</span>

                            <strong id="total">$0</strong>

                        </div>

                    </div>

                    <div class="obs">

                        <label>Observaciones</label>

                        <textarea
                            id="observaciones"
                            name="observaciones"
                            placeholder="Observaciones de la venta..."></textarea>

                    </div>

                    <div class="buttons-summary">

                        <button
                            type="submit"
                            class="save">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Registrar Venta

                        </button>

                        <button
                            type="reset"
                            class="cancel">

                            <i class="fa-solid fa-xmark"></i>

                            Cancelar

                        </button>

                    </div>

                </div>

            </aside>

        </section>

        <!-- ========================= -->
        <!-- TABLA PRODUCTOS -->
        <!-- ========================= -->

        <section class="card table-card">

            <h2>

                <i class="fa-solid fa-box-open"></i>

                Productos de la Venta

            </h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Subtotal</th>
                            <th>Acción</th>

                        </tr>

                    </thead>

                    <tbody id="detalle_venta">

                        <tr id="fila_vacia">

                            <td colspan="5" class="empty">

                                No hay productos agregados.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </form>

</main>
<script src="{{ url_for('static', filename='js/ventas.js') }}"></script>
</body>

</html>
