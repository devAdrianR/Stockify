{% extends "base.html" %}

{% block title %}Registrar Ingreso{% endblock %}

{% block content %}

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/registrar_ingreso.css') }}">

<div class="ingreso-container">

    <div class="page-header">
        <h1>Registrar Ingreso</h1>
        <p>Registra un nuevo ingreso para el negocio.</p>
    </div>

    <div class="form-card">

        <form method="POST"
              action="{{ url_for('ingresos.registrar_ingreso') }}"
              id="ingresoForm">

            <div class="form-grid">

                <!-- CONCEPTO -->
                <div class="form-group">
                    <label for="concepto">Concepto</label>

                    <input
                        type="text"
                        id="concepto"
                        name="concepto"
                        placeholder="Ej: Venta de productos"
                        required>
                </div>


                <!-- MONTO -->
                <div class="form-group">
                    <label for="monto">Monto</label>

                    <input
                        type="number"
                        id="monto"
                        name="monto"
                        placeholder="0.00"
                        min="0.01"
                        step="0.01"
                        required>
                </div>


                <!-- CATEGORÍA -->
                <div class="form-group">
                    <label for="categoria">Categoría</label>

                    <select
                        id="categoria"
                        name="categoria"
                        required>

                        <option value="">
                            Seleccione una categoría
                        </option>

                        <option value="Ventas">
                            Ventas
                        </option>

                        <option value="Servicios">
                            Servicios
                        </option>

                        <option value="Otros ingresos">
                            Otros ingresos
                        </option>

                    </select>
                </div>


                <!-- FECHA -->
                <div class="form-group">
                    <label for="fecha">Fecha</label>

                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                        required>
                </div>


                <!-- DESCRIPCIÓN -->
                <div class="form-group full-width">
                    <label for="descripcion">Descripción</label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        placeholder="Escriba una descripción del ingreso..."
                        rows="5"></textarea>
                </div>

            </div>


            <!-- BOTONES -->
            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-save">

                    <span>▣</span>
                    Guardar

                </button>

                <a
                    href="{{ url_for('dashboard_admin') }}"
                    class="btn btn-cancel">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='js/registrar_ingreso.js') }}"></script>

{% endblock %}
